services:
  glpi-kanban:
    build: .
    image: ghcr.io/robertocjunior/glpi-kanban:latest
    container_name: glpi-kanban
    restart: unless-stopped
    ports:
      - "8081:8081"
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/kanban.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
